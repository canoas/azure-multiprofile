name: release

# Push a version tag to stage a release on npm:
#   v0.2.0-rc.1, v0.2.0-beta.2  ->  npm dist-tag "next"   (npm i -g azure-multiprofile@next)
#   v0.2.0                      ->  npm dist-tag "latest" (npm i -g azure-multiprofile)
#
# CI only *stages* the version (npm stage publish). Nothing is installable until a
# maintainer approves it with 2FA:  npm stage list azure-multiprofile
#                                   npm stage approve <stage-id>
# The draft GitHub release this workflow creates is published automatically once the
# version is on npm (publish-releases.yml, daily or on demand).
#
# Auth is npm trusted publishing (OIDC), so no NPM_TOKEN secret is stored. One-time setup:
#   npx npm@11 trust github azure-multiprofile --repo canoas/azure-multiprofile \
#     --file release.yml --allow-stage-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing and `npm stage` need a current npm 11.
      - run: npm install -g npm@11

      - name: Resolve version and channel
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "channel=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "azure-multiprofile@$version" version >/dev/null 2>&1; then
            echo "::error::azure-multiprofile@$version is already on npm"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Stage on npm (${{ steps.meta.outputs.channel }})
        run: |
          set -o pipefail
          npm stage publish --access public --tag ${{ steps.meta.outputs.channel }} 2>&1 | tee stage.log

      - name: Approval instructions
        if: always()
        run: |
          {
            echo "## azure-multiprofile@${{ steps.meta.outputs.version }} staged for \`${{ steps.meta.outputs.channel }}\`"
            echo
            echo "Nothing is installable yet. Approve it with your passkey/2FA:"
            echo
            echo '```sh'
            echo "npm stage list azure-multiprofile"
            echo "npm stage approve <stage-id>      # or: npm stage reject <stage-id>"
            echo "npm view azure-multiprofile dist-tags"
            echo '```'
            echo
            echo "The draft GitHub release for $GITHUB_REF_NAME is published automatically by the next"
            echo "daily run after approval, or right away with: \`gh workflow run publish-releases.yml\`"
            echo
            echo '<details><summary>npm output</summary>'
            echo
            echo '```'
            cat stage.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --generate-notes --verify-tag)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install: \`npm install -g azure-multiprofile@${{ steps.meta.outputs.channel }}\`"
